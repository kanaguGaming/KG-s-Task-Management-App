<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-layout">
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Task Manager</div>
            <div class="nav-user">
                <span id="userNameDisplay">Welcome, User</span>
                <button onclick="logoutUser()" class="btn btn-outline btn-sm">Logout</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="stats-grid" id="statsContainer">
            <div class="stat-card">
                <div class="stat-title">Total Tasks</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card stat-pending">
                <div class="stat-title">Pending</div>
                <div class="stat-value" id="stat-pending">0</div>
            </div>
            <div class="stat-card stat-progress">
                <div class="stat-title">In Progress</div>
                <div class="stat-value" id="stat-progress">0</div>
            </div>
            <div class="stat-card stat-completed">
                <div class="stat-title">Completed</div>
                <div class="stat-value" id="stat-completed">0</div>
            </div>
        </section>

        <section class="controls-section">
            <div class="controls-header">
                <h2>My Tasks</h2>
                <button onclick="openTaskModal()" class="btn btn-primary">+ Add Task</button>
            </div>
            <div class="controls-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search tasks by title or description...">
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="All">All</button>
                    <button class="filter-btn" data-filter="Pending">Pending</button>
                    <button class="filter-btn" data-filter="In Progress">In Progress</button>
                    <button class="filter-btn" data-filter="Completed">Completed</button>
                </div>
            </div>
        </section>

        <section class="tasks-grid" id="tasksContainer">
        </section>
    </main>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Task</h3>
                <span class="close-modal" onclick="closeTaskModal()">&times;</span>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" required placeholder="Task title">
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" rows="3" placeholder="Task description"></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate" required>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" required>
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" required>
                            <option value="Pending" selected>Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Confirm Deletion</h3>
            </div>
            <p>Are you sure you want to delete this task? This action cannot be undone.</p>
            <div class="modal-footer mt-20">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
